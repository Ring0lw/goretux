[package]
name = "goretux"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
imgui = "=0.12.0"
imgui-glow-renderer = "=0.13.0"
winit = { version = "=0.30.13", default-features = false, features = ["x11", "rwh_06"] }
glutin = { version = "=0.32.3", default-features = false, features = ["glx", "egl", "x11"] }
glutin-winit = { version = "=0.5.0", default-features = false, features = ["glx", "egl", "x11"] }
glow = "=0.14.2"
x11rb = { version = "=0.13.2", features = ["shape"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
